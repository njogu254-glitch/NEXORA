<style>
:root{--g:#7B3AE8;--dg:#2A1263;--cream:#FFF9F0;--lime:#F8B858;--grn:#20B050;--org:#E89000;--mut:#5d5480;--bg:#FFF9F0;--tx:#2A1263;--card:#fff;--ln:#e5dcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B0B45;--tx:#FFF9F0;--card:#2A1263;--ln:#4a2e8f;--mut:#cbbfe8}}
:root[data-theme="dark"]{--bg:#1B0B45;--tx:#FFF9F0;--card:#2A1263;--ln:#4a2e8f;--mut:#cbbfe8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 Georgia,"Times New Roman",serif}
h1,h2,h3,nav,button,label,.k{font-family:"Arial Black",Impact,Arial,sans-serif}
h1{font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.02;margin:.2em 0;letter-spacing:-.02em}h2{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.1;margin:0 0 .5em}h3{margin:.2em 0}
a{color:inherit}.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--g);color:var(--cream);z-index:5}
header .w{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
header img{height:48px;background:var(--cream);border-radius:6px;padding:2px}
nav{display:flex;gap:4px;flex-wrap:wrap;font-size:.72rem;text-transform:uppercase}nav a{padding:8px 10px;text-decoration:none;border-radius:4px}nav a:hover,nav a[aria-current]{background:var(--lime);color:var(--dg)}
#mb{display:none;background:var(--lime);border:0;padding:10px 14px;font-size:.8rem;border-radius:4px;color:var(--dg)}
@media(max-width:860px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--g);flex-direction:column;padding:10px 20px}nav.o{display:flex}}
.hero{background:#3B1A8F;color:var(--cream);padding:64px 0 72px}.hero p{max-width:600px;font-size:1.2rem}
.hero em{font-style:normal;color:var(--lime)}
.btn{display:inline-block;padding:14px 22px;margin:6px 8px 6px 0;font:700 .85rem "Arial Black",Arial,sans-serif;text-transform:uppercase;text-decoration:none;border:2px solid var(--lime);background:var(--lime);color:var(--dg);cursor:pointer;border-radius:4px}
.btn.s{background:transparent;color:inherit}.hero .btn.s{color:var(--cream)}
section{padding:52px 0}.alt{background:var(--card)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{border-top:5px solid var(--g);background:var(--card);padding:18px}.grid>.card:nth-child(3n+2){border-top-color:var(--grn)}.grid>.card:nth-child(3n){border-top-color:var(--org)}.alt .card{background:var(--bg)}
.k{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
.note{border-left:5px solid var(--grn);background:var(--card);padding:12px 16px;color:var(--mut);font-size:.95rem;margin:18px 0}
form{display:grid;gap:14px;max-width:640px}label{font-size:.78rem;text-transform:uppercase;display:grid;gap:5px}
input,select,textarea{font:16px Georgia,serif;padding:11px;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:4px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.hp{position:absolute;left:-9999px}.msg{padding:12px;border-radius:4px;font-size:.95rem}.ok{background:#c4f0d0;color:#0b3d1c}.er{background:#ffd9d4;color:#5a0d00}
footer{background:var(--dg);color:var(--cream);padding:40px 0;font-size:.9rem}footer img{height:70px;background:var(--cream);border-radius:6px;padding:3px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs button{padding:8px 12px;border:2px solid var(--g);background:none;color:var(--tx);cursor:pointer;font-size:.7rem;text-transform:uppercase}.tabs .on{background:var(--g);color:var(--cream)}
.sm{padding:6px 10px;font-size:.7rem;margin:2px}
@media(prefers-reduced-motion:no-preference){.fade{animation:f .5s ease both}@keyframes f{from{opacity:0;transform:translateY(10px)}}}
</style>
</head>

let db=null,user=null,admin=false,S={email:'njogumugo020@gmail.com',phone:'[phone to be added]',location:'[location in Kenya to be added]',social:'[social media links to be added]'},stories=[],events=[],camp=null;
const pages=[['','Home'],['about','About'],['initiatives','Initiatives'],['stories','Stories'],['partner','Partner'],['join','Join'],['support','Support'],['contact','Contact']];
const NOTE='<p class="note">Nexora is in its planning stage. Everything described here is a plan or proposed focus area, not a completed achievement.</p>';
const initiatives=[['Skills &amp; employability','Proposed workshops and pathways that help young people build job-ready skills.'],['Entrepreneurship &amp; self-help groups','Proposed support for youth enterprises, innovation and savings or self-help groups.'],['Government opportunities','Proposed awareness sessions on youth development programmes and funding available from government.'],['Mental wellness &amp; prevention','Proposed awareness on mental wellness and substance-abuse prevention.'],['Sports &amp; teamwork','Proposed sports activities for teamwork and bonding across the community.'],['Mentorship &amp; leadership','Proposed mentorship, leadership development and community participation.']];
const cards=a=>'<div class="grid">'+a.map(i=>'<div class="card fade"><h3>'+i[0]+'</h3><p>'+i[1]+'</p></div>').join('')+'</div>';
const cta='<section><div class="w"><h2>Be part of building it</h2><a class="btn" href="#/join">Join the Movement</a><a class="btn s" href="#/partner">Partner with Nexora</a><a class="btn s" href="#/support">Support Nexora</a></div></section>';
const hero=(t,p)=>'<div class="hero"><div class="w"><h1>'+t+'</h1><p>'+p+'</p></div></div>';
function listStories(){const pub=stories.filter(s=>s.status==='published');return pub.length?'<div class="grid">'+pub.map(s=>'<article class="card"><p class="k">'+esc(s.category||'Story')+' · '+esc(s.date||'')+'</p><h3><a href="#/story/'+s.id+'">'+esc(s.title)+'</a></h3><p>'+esc(s.summary)+'</p></article>').join('')+'</div>':'<p class="note">No stories or events have been published yet. Check back soon.</p>'}
const P={
'':()=>hero('The future doesn’t happen by itself. <em>We build it.</em>','Connecting young people to opportunities, skills, leadership and a future they can shape themselves.<br><a class="btn" href="#/join">Join the Movement</a><a class="btn s" href="#/partner">Partner with Nexora</a>')+'<section><div class="w"><h2>What is Nexora?</h2><p>Nexora Youth Movement is a youth-led community movement in Kenya, built around one idea: connecting people to the next generation of possibilities.</p>'+NOTE+'</div></section><section class="alt"><div class="w"><h2>Proposed focus areas</h2>'+cards(initiatives.slice(0,3))+'<p><a href="#/initiatives">See all focus areas →</a></p></div></section><section><div class="w"><h2>Latest stories &amp; upcoming activities</h2>'+listStories()+'</div></section>'+cta,
about:()=>hero('Our story','Nexora exists so that young people do not have to find opportunity alone.')+'<section><div class="w"><h2>Mission</h2><p>Connect young people with opportunities, knowledge, resources and supportive networks for growth, leadership and transformation.</p><h2>Vision</h2><p>A connected and empowered community where people develop their potential and transform their lives and society.</p><h2>Core values</h2>'+cards([['Empowerment',''],['Integrity',''],['Inclusion',''],['Creativity',''],['Accountability',''],['Collaboration',''],['Sustainable development','']])+NOTE+'</div></section>'+cta,
initiatives:()=>hero('Our initiatives','Focus areas and proposed initiatives, until activities have actually taken place.')+'<section><div class="w">'+cards(initiatives)+NOTE+'</div></section>'+cta,
stories:()=>hero('Stories &amp; updates','News, stories and event announcements.')+'<section><div class="w"><label>Search<input id="q" type="search" placeholder="Search stories"></label><div id="sl" style="margin-top:18px">'+listStories()+'</div></div></section>',
partner:()=>hero('Partner with us','Businesses, foundations, institutions, community organisations and individuals can collaborate with Nexora.')+'<section><div class="w">'+cards([['Financial sponsorship',''],['In-kind support &amp; equipment',''],['Training &amp; mentorship',''],['Venue &amp; event support',''],['Skills &amp; technical partnerships','']])+'<p class="note">Nexora currently has no announced partners. Enquiries do not imply any endorsement.</p><h2>Partnership enquiry</h2><div id="f"></div></div></section>',
join:()=>hero('Join the movement','Tell us you’re interested in volunteering or becoming a member.')+'<section><div class="w"><p class="note">Submitting this form expresses interest only. It does not guarantee membership; we will follow up. Your details are never shown publicly.</p><div id="f"></div></div></section>',
support:()=>hero('Support &amp; fundraising','Ways to help Nexora grow.')+'<section><div class="w">'+cards([['Sponsorship',''],['Donated materials',''],['Mentorship',''],['Volunteering',''],['Approved fundraising activities','']])+'<p class="note">Nexora is not a registered charity and donations are not tax-deductible. Direct payment collection is switched off until legal, financial and payment arrangements are confirmed. To help, please <a href="#/partner">send an enquiry</a> or <a href="#/contact">contact us</a>.</p><div id="cp"></div></div></section>',
contact:()=>hero('Contact','Get in touch with the Nexora team.')+'<section><div class="w grid"><div><p>Email: '+esc(S.email)+'<br>Phone: '+esc(S.phone)+'<br>Location: '+esc(S.location)+'<br>Social: '+esc(S.social)+'</p></div><div id="f"></div></div></section>'
};
const forms={
partner:{col:'enquiries',fields:[['name','Name','text',1],['organisation','Organisation','text'],['email','Email','email',1],['phone','Phone (optional)','tel'],['interest','Partnership interest','select',1,['Financial sponsorship','In-kind support','Training & mentorship','Venue & events','Technical partnership']],['support','Proposed support','text'],['message','Message','textarea',1]],btn:'Send enquiry'},
join:{col:'applications',fields:[['name','Full name','text',1],['email','Email address','email',1],['phone','Phone (optional)','tel'],['county','County','text',1],['town','Town','text'],['age','Age range (optional)','select',0,['','Under 18','18–24','25–30','31–35','36+']],['skills','Skills and interests','text'],['area','Preferred volunteering area','select',1,['Skills & employability','Entrepreneurship','Government opportunities','Mental wellness','Sports','Mentorship & leadership','Anywhere']],['availability','Availability','text'],['message','Short message','textarea']],consent:1,btn:'Submit interest'},
contact:{col:'messages',fields:[['name','Name','text',1],['email','Email','email',1],['message','Message','textarea',1]],btn:'Send message'}};
function formHTML(k){const f=forms[k];return '<form id="ff" novalidate>'+f.fields.map(x=>'<label>'+x[1]+(x[3]?' *':'')+(x[2]==='select'?'<select name="'+x[0]+'">'+x[4].map(o=>'<option>'+o+'</option>').join('')+'</select>':x[2]==='textarea'?'<textarea name="'+x[0]+'" rows="4" maxlength="2000"></textarea>':'<input name="'+x[0]+'" type="'+x[2]+'" maxlength="200">')+'</label>').join('')+(f.consent?'<label style="text-transform:none;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="consent" style="width:auto;margin-top:5px"> I agree to be contacted about my interest. I have read the privacy notice below. *</label><p class="note">Privacy: we collect only what is needed to follow up your interest, show it only to authorised administrators, and plan to delete it when no longer needed.</p>':'')+'<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">'+f.btn+'</button><div id="fm" role="status"></div></form>'}
function bindForm(k){const el=$('#ff');if(!el)return;const f=forms[k],m=$('#fm'),t0=Date.now();el.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(el));if(d.website)return;if(Date.now()-t0<3000)return err('Please take a moment to complete the form, then try again.');if(Date.now()-(window._ls||0)<30000)return err('Please wait 30 seconds before submitting again.');
for(const x of f.fields){const v=(d[x[0]]||'').trim();if(x[3]&&!v)return err('Please fill in: '+x[1]);if(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(v)||v.length>(x[2]==='textarea'?2000:200))return err('Invalid input in: '+x[1]);if(x[2]==='email'&&v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return err('Please enter a valid email address.');if(x[2]==='tel'&&v&&!/^[+\d][\d\s()-]{6,19}$/.test(v))return err('Please enter a valid phone number.');if(x[2]==='select'&&!x[4].includes(d[x[0]]))return err('Please choose a valid option for: '+x[1])}
if(f.consent&&!d.consent)return err('Consent is needed so we can contact you.');
if(!db)return err('Submissions are not available right now: the storage backend is not connected for visitors yet, so nothing was saved. Please use the contact details on the Contact page.');
const rec={};f.fields.forEach(x=>rec[x[0]]=(d[x[0]]||'').trim());rec.createdAt=new Date().toISOString();rec.status='new';if(f.consent)rec.consent=true;
try{await db.collection(f.col).add(rec);window._ls=Date.now();el.reset();m.className='msg ok';m.textContent='Thank you. Your submission has been saved and we will follow up.'}catch(x){err('Sorry, your submission could not be saved. Please try again later.')}};
function err(t){m.className='msg er';m.textContent=t}}
function setNav(r){$('#nav').innerHTML=pages.map(p=>'<a href="#/'+p[0]+'"'+(('/'+p[0])===r||(!p[0]&&r==='/')?' aria-current="page"':'')+'>'+p[1]+'</a>').join('');}
$('#mb').onclick=()=>{const o=$('#nav').classList.toggle('o');$('#mb').setAttribute('aria-expanded',o)};
function render(){const r=location.hash.slice(1)||'/',app=$('#app');setNav(r);$('#nav').classList.remove('o');$('#yr').textContent=new Date().getFullYear();$('#fc').innerHTML='<p>'+esc(S.email)+'</p>';
let h;if(r==='/admin'){h=adminUI();app.innerHTML=h;adminBind();return}
if(r.startsWith('/story/')){const s=stories.find(x=>x.id===r.slice(7)&&x.status==='published');h=s?hero(esc(s.title),esc(s.date||''))+'<section><div class="w"><p style="white-space:pre-wrap">'+esc(s.body||s.summary)+'</p><a href="#/stories">← All stories</a></div></section>':hero('Story not found','')+'<section><div class="w"><a href="#/stories">← All stories</a></div></section>'}
else{const k=r.slice(1),fn=P[k];h=fn?fn():hero('Page not found','That page doesn’t exist.')+'<section><div class="w"><a class="btn" href="#/">Back home</a></div></section>';document.title=(k?k[0].toUpperCase()+k.slice(1)+' | ':'')+'Nexora Youth Movement'}
app.innerHTML=h;window.scrollTo(0,0);const k=r.slice(1);if(forms[k]&&$('#f')){$('#f').innerHTML=formHTML(k);bindForm(k)}
if(k==='stories'&&$('#q'))$('#q').oninput=e=>{const q=e.target.value.toLowerCase(),keep=stories;stories=keep.filter(s=>(s.title+s.summary).toLowerCase().includes(q));$('#sl').innerHTML=listStories();stories=keep};
if(k==='support'&&camp&&camp.published)$('#cp').innerHTML='<h2>'+esc(camp.title)+'</h2><p>'+esc(camp.description)+'</p><p><b>Goal:</b> '+esc(camp.goal)+' · <b>Verified raised:</b> '+esc(camp.raised)+'</p><p class="note">Published figures must be supported by actual records.</p>'}
/* ADMIN */
let tab='Overview',data={};const cols={Applications:'applications',Enquiries:'enquiries',Messages:'messages',Stories:'stories',Events:'events'};
function adminUI(){if(!db||!admin)return hero('Page not found','That page doesn’t exist.')+'<section><div class="w"><a class="btn" href="#/">Back home</a></div></section>';
return hero('Admin dashboard','Signed in as an authorised administrator.')+'<section><div class="w"><div class="tabs">'+['Overview','Applications','Enquiries','Messages','Stories','Events','Fundraising','Settings'].map(t=>'<button class="'+(t===tab?'on':'')+'" data-t="'+t+'">'+t+'</button>').join('')+'</div><div id="ap">Loading…</div></div></section>'}
async function load(c){try{const s=await db.collection(c).get();return s.docs.filter(d=>/^[\w.~:@+-]+$/.test(d.id)).map(d=>Object.assign({id:d.id},d.data()))}catch(e){return null}}
async function adminBind(){if(!db||!admin)return;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});const el=$('#ap');
const msg=(t,ok)=>'<p class="msg '+(ok?'ok':'er')+'" role="status">'+t+'</p>';
if(tab==='Overview'){const o=[];for(const t of ['Applications','Enquiries','Messages','Stories','Events']){const d=await load(cols[t]);o.push('<div class="card"><p class="k">'+t+'</p><h2>'+(d?d.length:'n/a')+'</h2></div>')}el.innerHTML='<div class="grid">'+o.join('')+'</div>';return}
if(tab==='Fundraising'||tab==='Settings'){const path=tab==='Settings'?'site/settings':'site/campaign',cur=(await db.doc(path).get()).data()||{},fs=tab==='Settings'?[['email','Public email'],['phone','Phone'],['location','Location'],['social','Social links']]:[['title','Campaign title'],['description','Description'],['goal','Goal'],['raised','Verified raised (actual records only)']];
el.innerHTML='<form id="ae">'+fs.map(f=>'<label>'+f[1]+'<input name="'+f[0]+'" value="'+esc(cur[f[0]])+'" maxlength="500"></label>').join('')+(tab==='Fundraising'?'<label style="display:flex;gap:8px;text-transform:none"><input type="checkbox" name="published" style="width:auto"'+(cur.published?' checked':'')+'> Publish on the Support page</label><p class="note">Only publish figures supported by actual records.</p>':'')+'<button class="btn">Save</button><div id="am"></div></form>';
$('#ae').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(tab==='Fundraising')d.published=!!d.published;for(const q in d)if(typeof d[q]==='string')d[q]=d[q].slice(0,500);try{await db.doc(path).set(d);$('#am').innerHTML=msg('Saved.',1);if(tab==='Settings')Object.assign(S,d);else camp=d}catch(x){$('#am').innerHTML=msg('Could not save.')}};return}
const c=cols[tab],d=await load(c);if(!d){el.innerHTML=msg('Could not load. You may not have permission.');return}
let h='';if(tab==='Stories'||tab==='Events')h+='<form id="an" style="margin-bottom:24px"><label>Title<input name="title" required maxlength="150"></label><label>Date<input name="date" type="date"></label><label>Summary<input name="summary" maxlength="300"></label><label>Body<textarea name="body" rows="4" maxlength="10000"></textarea></label><button class="btn">Create draft</button></form>';
h+='<input id="fq" placeholder="Search…" style="margin-bottom:12px">'+(d.length?'<div style="overflow-x:auto"><table id="tb"></table></div>':'<p>Nothing here yet.</p>');el.innerHTML=h;
const draw=q=>{const tb=$('#tb');if(!tb)return;tb.innerHTML=d.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).sort((a,b)=>(b.createdAt||'')>(a.createdAt||'')?1:-1).map(r=>'<tr><td><b>'+esc(r.title||r.name)+'</b><br>'+esc(r.email||r.summary||'')+'<br><small>'+esc(r.createdAt?r.createdAt.slice(0,10):'')+(r.county?' · '+esc(r.county):'')+(r.interest?' · '+esc(r.interest):'')+'</small><br>'+esc(r.message||r.body||'')+'</td><td>'+esc(r.status)+'</td><td>'+(tab==='Stories'?'<button class="btn sm" data-a="published" data-i="'+r.id+'">Publish</button><button class="btn s sm" data-a="draft" data-i="'+r.id+'">Unpublish</button><button class="btn s sm" data-a="archived" data-i="'+r.id+'">Archive</button>':['new','contacted','closed'].map(s=>'<button class="btn s sm" data-a="'+s+'" data-i="'+r.id+'">'+s+'</button>').join(''))+'<button class="btn s sm" data-a="del" data-i="'+r.id+'">Delete</button></td></tr>').join('');
tb.querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{if(b.dataset.a==='del'){if(!confirm('Delete this record permanently? This cannot be undone.'))return;await db.collection(c).doc(b.dataset.i).delete()}else{if(!['new','contacted','closed','draft','published','archived'].includes(b.dataset.a))return;await db.collection(c).doc(b.dataset.i).update({status:b.dataset.a})}await boot();render()}catch(x){alert('Action failed. You may not have permission.')}})};draw('');if($('#fq'))$('#fq').oninput=e=>draw(e.target.value.toLowerCase());
if($('#an'))$('#an').onsubmit=async e=>{e.preventDefault();const r=Object.fromEntries(new FormData(e.target));if(!r.title.trim())return;r.title=r.title.slice(0,150);r.summary=(r.summary||'').slice(0,300);r.body=(r.body||'').slice(0,10000);r.status='draft';r.category=tab==='Events'?'Event':'Story';r.createdAt=new Date().toISOString();try{await db.collection(c).add(r);await boot();render()}catch(x){alert('Could not save.')}}}
async function boot(){if(!db)return;try{const s=await db.collection('stories').get();stories=s.docs.filter(d=>/^[\w.~:@+-]+$/.test(d.id)).map(d=>Object.assign({id:d.id},d.data()));const e=await db.collection('events').get();events=e.docs.filter(d=>/^[\w.~:@+-]+$/.test(d.id)).map(d=>Object.assign({id:d.id},d.data()));const st=await db.doc('site/settings').get();if(st.exists)Object.assign(S,st.data());const cm=await db.doc('site/campaign').get();camp=cm.exists?cm.data():null}catch(x){}
stories=stories.concat(events.map(x=>Object.assign({},x,{category:'Event'}))).filter(s=>s.status==='published'||admin).sort((a,b)=>(b.date||'')>(a.date||'')?1:-1)}
addEventListener('hashchange',render);render();
(async()=>{try{if(!window.claude)return;user=await claude.use('user');db=await claude.use('db');admin=!!(user&&user.canEdit&&user.canEdit());await boot();render()}catch(e){}})();
</script>
</body>
</html>
